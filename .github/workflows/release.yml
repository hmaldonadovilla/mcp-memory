# Deliberate npm publication consumes a verified tarball in a separate, dependency-free OIDC job.
name: Release npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed version tag (v0.1.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npm run local:gate
      - name: Verify version tag and stage the tested package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("package.json")); if(process.env.TAG!=="v"+p.version) throw Error("Tag/version mismatch");'
          mkdir release-artifact
          cp .local/package/*.tgz .local/package/receipt.json release-artifact/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release-artifact/
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release-artifact
      - name: Validate and publish the exact artifact
        env:
          TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,readdirSync} from "node:fs";
          import {createHash} from "node:crypto";
          import {execFileSync} from "node:child_process";
          const receipt=JSON.parse(readFileSync("release-artifact/receipt.json"));
          const files=readdirSync("release-artifact").filter(f=>f.endsWith(".tgz"));
          if(files.length!==1||files[0]!==receipt.filename||!/^hmaldonadovilla-mcp-memory-[0-9]+\.[0-9]+\.[0-9]+\.tgz$/.test(files[0]))throw Error("Invalid artifact identity");
          const file="./release-artifact/"+files[0];
          if(createHash("sha256").update(readFileSync(file)).digest("hex")!==receipt.sha256)throw Error("Artifact checksum mismatch");
          const p=JSON.parse(execFileSync("tar",["-xOf",file,"package/package.json"],{encoding:"utf8"}));
          if(p.name!=="@hmaldonadovilla/mcp-memory"||"v"+p.version!==process.env.TAG||JSON.stringify(p.publishConfig)!=='{"access":"public"}')throw Error("Unapproved publication metadata");
          const [major,minor]=execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number);
          if(major<11||(major===11&&minor<6))throw Error("A bundled npm with trusted-publishing support is required");
          execFileSync("npm",["publish",file,"--access","public","--provenance","--ignore-scripts","--registry","https://registry.npmjs.org"],{stdio:"inherit"});
          JS
