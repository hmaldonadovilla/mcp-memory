# Validate the standalone package without provider credentials or publication permissions.
name: CI
on:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24.19.0", "26"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run local:gate
      - run: npm audit --omit=dev --audit-level=moderate
